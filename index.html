    if(li&&ri)out.push(m3(bi,li,ri));else if(li){if(!bi||!eq(li,bi))out.push(li)}else if(ri){if(!bi||!eq(ri,bi))out.push(ri)}});

  return l}

(function(){const btn=$('#menuBtn'),menu=$('#mmenu');if(!btn||!menu)return;const root=document.documentElement,desk=matchMedia('(min-width: 761px)');
 function origin(){const r=btn.getBoundingClientRect();menu.style.setProperty('--mx',(r.left+r.width/2)+'px');menu.style.setProperty('--my',(r.top+r.height/2)+'px')}
 function set(o){if(o===menu.classList.contains('open'))return;if(o)origin();menu.classList.toggle('open',o);root.classList.toggle('mm-lock',o);btn.setAttribute('aria-expanded',String(o));btn.setAttribute('aria-label',o?'Tutup menu':'Buka menu')}
 btn.addEventListener('click',e=>{e.stopPropagation();set(!menu.classList.contains('open'))});
 menu.addEventListener('click',e=>{if(e.target.closest('button'))set(false)});
 document.addEventListener('keydown',e=>{if(e.key=='Escape'&&menu.classList.contains('open')){set(false);btn.focus()}});
 const od=()=>{if(desk.matches)set(false)};desk.addEventListener?desk.addEventListener('change',od):desk.addListener(od)})();
document.addEventListener('input',e=>{const t=e.target;if(!F)return;if(t.id=='tfp'){F.p=t.value;gpsShow()}else if(t.id=='tfk')F.k=t.value});
draw();
